name: Build adaptation packages

on:
  push:
    branches: [ main, trixie ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev gnupg

      - name: Build all packages
        run: |
          mkdir -p out

          for dir in packages/*; do
            if [ -d "$dir" ]; then
              echo "Building $dir"

              dpkg-deb -b "$dir" "out/$(basename "$dir").deb"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: out/
