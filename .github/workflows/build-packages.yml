name: Build and Publish Packages

on:
  push:
    branches: [ "main", "trixie", "bookworm" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        device:
          - crownqltechn
          - starqltechn
          - star2qltechn

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev devscripts build-essential fakeroot

      - name: Build package
        run: |
          cd adaptation-samsung-${{ matrix.device }}
          echo "=== Current directory ==="
          pwd
          echo "=== Directory contents ==="
          ls -la
          echo "=== Debian directory contents ==="
          ls -la debian/
          echo "=== Starting build ==="
          dpkg-buildpackage -us -uc -b 2>&1
          echo "=== Build completed ==="
          
      - name: Collect .deb
        run: |
          mkdir -p packages/${{ matrix.device }}
          echo "=== Looking for .deb files ==="
          ls -la
          ls -la adaptation-samsung-${{ matrix.device }}/
          find adaptation-samsung-${{ matrix.device }} -maxdepth 1 -name "*.deb" -type f || echo "No .deb files found"
          find adaptation-samsung-${{ matrix.device }} -maxdepth 1 -name "*.deb" -exec mv {} packages/${{ matrix.device }}/ \;
          echo "=== Collected packages ==="
          ls -la packages/${{ matrix.device }}/ || echo "packages directory is empty"
          
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Checkout repo repo
        uses: actions/checkout@v4
        with:
          repository: gdlukee/droidian-samsung_sdm845-repo
          token: ${{ secrets.GH_TOKEN }}
          path: repo

      - name: Copy packages
        run: |
          mkdir -p repo/packages
          find packages -name "*.deb" -exec cp {} repo/packages/ \;

      - name: Generate repo index
        run: |
          cd repo/packages

          for d in */; do
            dpkg-scanpackages "$d" /dev/null > "$d/Packages"
            gzip -kf "$d/Packages"
          done

      - name: Commit repo
        run: |
          cd repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update packages" || true
          git push
